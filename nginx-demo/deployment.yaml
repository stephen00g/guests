apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-demo
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: nginx-demo
  template:
    metadata:
      labels:
        app: nginx-demo
    spec:
      serviceAccountName: nginx-demo
      initContainers:
        - name: copy-dashboard
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              cp -a /mnt/source/. /var/www/html/
              echo "$(date -Iseconds)" > /var/www/html/VERSION
          volumeMounts:
            - name: dashboard-source
              mountPath: /mnt/source
              readOnly: true
            - name: html
              mountPath: /var/www/html
      containers:
        - name: php
          image: php:8.2-apache
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /var/www/html
            - name: sa-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        - name: dashboard-source
          configMap:
            name: nginx-demo-welcome
        - name: html
          emptyDir: {}
        # Explicit token mount (required on Kubernetes 1.24+ where legacy SA token is not auto-mounted)
        - name: sa-token
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3607
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt

